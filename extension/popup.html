<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 ui-sans-serif, system-ui; margin: 0; width: 280px; background: #122017; color: #e8efe6; }
      main { padding: 14px; }
      h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #d4a017; margin: 0 0 8px; }
      p { margin: 0 0 8px; color: #b7c4b3; }
      .ok { color: #7dcf8a; }
      .wait { color: #d4a017; }
      a { color: #d4a017; }
      ol { margin: 8px 0 0; padding-left: 18px; color: #b7c4b3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Feltline</h1>
      <p id="status" class="wait">Looking for a Poker Now table…</p>
      <p>Keep this table and the Feltline coach tab open. Suggested action stays on the website; Take clicks here.</p>
      <p><a href="https://feltline-ten.vercel.app/tables" target="_blank">Open Feltline</a></p>
      <ol>
        <li>Sign in on Feltline and add this table’s link.</li>
        <li>Open the coach page.</li>
        <li>When it’s your turn, Take / Override / Ignore.</li>
      </ol>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
