[project]
name = "pokernow-private-agent"
version = "0.1.0"
description = "Consent-based private table 9-max NLH agent framework"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48", "pydantic>=2.8", "numpy>=1.26", "aiohttp>=3.10"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
poker-agent = "poker_agent.cli:main"
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
poker_agent = ["data/*.json"]
